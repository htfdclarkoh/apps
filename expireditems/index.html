<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expiring Equipment Tracker</title>
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .table-fixed-header {
            width: 100%;
            border-collapse: collapse;
        }
        .table-fixed-header thead th {
            position: sticky;
            top: 0;
            background-color: #f8fafc; /* Tailwind gray-50 */
            z-index: 10;
        }
        .loader {
            border: 8px solid #f3f3f3; /* Light grey */
            border-top: 8px solid #3498db; /* Blue */
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 2s linear infinite;
            margin: 50px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <header class="text-center mb-10">
            <h1 class="text-4xl sm:text-5xl font-bold text-gray-900">Expiring Equipment Tracker</h1>
            <p class="text-lg text-gray-600 mt-3">Nearing Expiration of EMS Items on Apparatus</p>
        </header>

        <!-- Legend -->
        <div class="flex flex-wrap justify-center gap-6 mb-10">
            <div class="flex items-center space-x-3">
                <span class="w-6 h-6 bg-red-200 rounded-full border border-red-400"></span>
                <span class="text-base font-medium">Expired or Expires within 10 days</span>
            </div>
            <div class="flex items-center space-x-3">
                <span class="w-6 h-6 bg-yellow-200 rounded-full border border-yellow-400"></span>
                <span class="text-base font-medium">Expires in 11-30 days</span>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loader" class="loader"></div>

        <!-- Table Container -->
        <div id="table-container" class="hidden overflow-x-auto bg-white rounded-lg shadow-md">
            <table class="table-fixed-header min-w-full">
                <thead class="bg-gray-50">
                    <tr>
                        <th scope="col" class="py-4 px-6 text-left text-base font-semibold text-gray-900">Apparatus</th>
                        <th scope="col" class="py-4 px-6 text-left text-base font-semibold text-gray-900">Location</th>
                        <th scope="col" class="py-4 px-6 text-left text-base font-semibold text-gray-900">SubLocation</th>
                        <th scope="col" class="py-4 px-6 text-left text-base font-semibold text-gray-900">Equipment</th>
                        <th scope="col" class="py-4 px-6 text-left text-base font-semibold text-gray-900">Expires</th>
                        <th scope="col" class="py-4 px-6 text-left text-base font-semibold text-gray-900">Notes</th>
                    </tr>
                </thead>
                <tbody id="equipment-table-body" class="divide-y divide-gray-200">
                    <!-- Data rows will be inserted here by JavaScript -->
                </tbody>
            </table>
        </div>
         <p id="error-message" class="text-center text-red-500 mt-4 hidden"></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vREj5ma5nBXP4hraVILhh53tWF1P4rnd_EE1OQWRgiRS4A1YokLkIB2ATz5Bw90Eqh5CtQvvzbl-Axm/pub?gid=994084926&single=true&output=csv';
            const loader = document.getElementById('loader');
            const tableContainer = document.getElementById('table-container');
            const tableBody = document.getElementById('equipment-table-body');
            const errorMessage = document.getElementById('error-message');

            // Function to fetch and process data
            async function fetchSheetData() {
                try {
                    const response = await fetch(sheetUrl);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const csvText = await response.text();
                    const data = parseCSV(csvText);
                    displayData(data);
                } catch (error) {
                    console.error('Error fetching or parsing data:', error);
                    loader.style.display = 'none';
                    errorMessage.textContent = 'Failed to load data. Please check the Google Sheet URL and permissions.';
                    errorMessage.style.display = 'block';
                }
            }

            // Function to parse CSV text into an array of objects
            function parseCSV(text) {
                // Standardize line breaks and split into lines
                const lines = text.trim().replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');

                // Robustly parse a single CSV line, handling quotes and empty fields
                const parseLine = (line) => {
                    const values = [];
                    let current = '';
                    let inQuotes = false;
                    for (let i = 0; i < line.length; i++) {
                        const char = line[i];
                        
                        if (char === '"') {
                            // Handle escaped quotes ("")
                            if (inQuotes && i < line.length - 1 && line[i+1] === '"') {
                                current += '"';
                                i++; // Skip the next quote
                            } else {
                                inQuotes = !inQuotes;
                            }
                        } else if (char === ',' && !inQuotes) {
                            values.push(current);
                            current = '';
                        } else {
                            current += char;
                        }
                    }
                    values.push(current);
                    return values;
                };

                if (lines.length < 1) return [];

                const headers = parseLine(lines[0]).map(h => h.trim());
                
                return lines.slice(1).map(line => {
                    if (!line.trim()) return null; // Skip empty lines

                    const values = parseLine(line);
                    
                    // Skip rows that don't have the same number of columns as the header
                    if (values.length !== headers.length) {
                        console.warn("Skipping malformed row:", line);
                        return null;
                    }

                    const rowObject = {};
                    headers.forEach((header, i) => {
                        rowObject[header] = (values[i] || '').trim();
                    });
                    return rowObject;
                }).filter(row => row !== null); // Filter out skipped rows
            }
            
            // Function to display data in the table
            function displayData(data) {
                tableBody.innerHTML = ''; // Clear existing rows
                const today = new Date();
                today.setHours(0, 0, 0, 0); // Normalize today's date to midnight for accurate day comparison

                // Sort data by expiration date, oldest first
                data.sort((a, b) => new Date(a.Expires) - new Date(b.Expires));

                data.forEach(row => {
                    // Skip row if any essential data field is empty. "Notes" and "SubLocation" are optional.
                    const essentialFields = ["Apparatus", "Location", "Equipment", "Expires"];
                    const isIncomplete = essentialFields.some(field => !row[field] || row[field].trim() === '');

                    if (isIncomplete) {
                        console.warn("Skipping row with empty essential fields:", row);
                        return; // Skip this row
                    }

                    const expirationDate = new Date(row.Expires);
                    if (isNaN(expirationDate.getTime())) {
                        console.warn('Invalid date found for row:', row);
                        return; // Skip rows with invalid dates
                    }
                    
                    expirationDate.setHours(0,0,0,0); // Also normalize the expiration date

                    const timeDiff = expirationDate.getTime() - today.getTime();
                    const dayDiff = Math.ceil(timeDiff / (1000 * 3600 * 24));

                    // Only show items that are yellow or red (expiring within 30 days)
                    if (dayDiff > 30) {
                        return; // Skip this item
                    }

                    let rowClass = '';
                    if (dayDiff <= 10) {
                        rowClass = 'bg-red-100 hover:bg-red-200'; // Expired or expires within 10 days
                    } else {
                        rowClass = 'bg-yellow-100 hover:bg-yellow-200'; // Expires between 11 and 30 days
                    }

                    const tr = document.createElement('tr');
                    tr.className = `${rowClass} transition-colors duration-200`;
                    
                    // Order of headers from the problem description
                    const headersOrder = ["Apparatus", "Location", "SubLocation", "Equipment", "Expires", "Notes"];

                    headersOrder.forEach(header => {
                        const td = document.createElement('td');
                        td.className = 'py-5 px-6 text-base text-gray-700 whitespace-nowrap';
                        td.textContent = row[header] || '';
                        tr.appendChild(td);
                    });

                    tableBody.appendChild(tr);
                });

                // Hide loader and show table
                loader.style.display = 'none';
                tableContainer.style.display = 'block';
            }

            // Initial call to load data
            fetchSheetData();
        });
    </script>

</body>
</html>
