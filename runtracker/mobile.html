<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#071018">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HTFD">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>RMS Call Tracker</title>
  <link rel="icon" type="image/png" href="./assets/icon-AV2rQ6CU.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icon-AV2rQ6CU.png">

  <style>
    :root {
      color-scheme: dark;
      background: #071018;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% -12%, rgba(220, 38, 38, .18), transparent 31rem),
        #071018;
    }

    body {
      position: fixed;
      inset: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    .app-frame {
      position: fixed;
      top: var(--safe-top);
      right: var(--safe-right);
      bottom: 0;
      left: var(--safe-left);
      display: block;
      width: calc(100% - var(--safe-left) - var(--safe-right));
      height: calc(100% - var(--safe-top));
      border: 0;
      background: #071018;
      opacity: 0;
      transition: opacity .22s ease;
    }

    .app-frame.ready { opacity: 1; }

    .launch-screen {
      position: fixed;
      inset: var(--safe-top) var(--safe-right) 0 var(--safe-left);
      z-index: 2;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 14px;
      background: #071018;
      color: #f9fafb;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: opacity .2s ease, visibility .2s ease;
    }

    .launch-screen.hidden {
      visibility: hidden;
      opacity: 0;
    }

    .launch-icon {
      position: relative;
      display: grid;
      width: 68px;
      height: 68px;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(248, 113, 113, .45);
      border-radius: 19px;
      background: #111827;
      box-shadow: 0 16px 44px rgba(0, 0, 0, .42), 0 0 0 6px rgba(220, 38, 38, .08);
    }

    .launch-icon::before,
    .launch-icon::after {
      position: absolute;
      border-radius: 3px;
      background: #ef4444;
      box-shadow: 0 0 18px rgba(239, 68, 68, .3);
      content: "";
    }

    .launch-icon::before { width: 36px; height: 13px; }
    .launch-icon::after { width: 13px; height: 36px; }

    .launch-title {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
    }

    .launch-caption {
      margin: -7px 0 0;
      color: #6b7280;
      font-size: 10px;
      font-weight: 700;
    }

    .spinner {
      width: 22px;
      height: 22px;
      margin-top: 7px;
      border: 2px solid #263241;
      border-top-color: #ef4444;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(1turn); } }

    @media (prefers-reduced-motion: reduce) {
      .app-frame,
      .launch-screen { transition: none; }
      .spinner { animation-duration: 1.8s; }
    }
  </style>
</head>
<body>
  <div id="launchScreen" class="launch-screen" aria-live="polite">
    <div class="launch-icon" aria-hidden="true"></div>
    <p class="launch-title">RMS Call Tracker</p>
    <p class="launch-caption">Harmony Township</p>
    <div class="spinner" aria-label="Loading application"></div>
  </div>

  <iframe
    id="appFrame"
    class="app-frame"
    src="./index.html"
    title="RMS Call Tracker mobile application"
    allow="clipboard-write"
  ></iframe>

  <script>
    (() => {
      const frame = document.getElementById('appFrame');
      const launchScreen = document.getElementById('launchScreen');

      const mobileStyles = `
        :root {
          color-scheme: dark;
          background: #071018;
          --mobile-nav-height: 76px;
          --mobile-safe-bottom: clamp(2px, var(--host-safe-bottom, 2px), 4px);
          --mobile-nav-total-height: calc(var(--mobile-nav-height) + var(--mobile-safe-bottom));
        }

        html {
          background: #071018;
          overscroll-behavior: none;
        }

        body {
          min-height: 100%;
          overflow-x: hidden;
          background:
            radial-gradient(circle at 50% -12%, rgba(220, 38, 38, .16), transparent 28rem),
            #071018 !important;
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif !important;
          -webkit-font-smoothing: antialiased;
          -webkit-tap-highlight-color: transparent;
          touch-action: manipulation;
        }

        nav {
          position: sticky !important;
          top: 0;
          z-index: 60 !important;
          min-height: 66px;
          padding: 10px 14px !important;
          border-color: rgba(75, 85, 99, .58) !important;
          background: rgba(10, 18, 28, .9) !important;
          box-shadow: 0 8px 26px rgba(0, 0, 0, .22) !important;
          -webkit-backdrop-filter: blur(18px) saturate(140%);
          backdrop-filter: blur(18px) saturate(140%);
        }

        .app-nav-inner {
          display: flex !important;
          max-width: 100% !important;
          flex-direction: row !important;
          align-items: center !important;
          gap: 10px !important;
        }

        .app-nav-inner > .flex:first-child {
          width: 100%;
          min-width: 0;
          gap: 10px !important;
        }

        .app-nav-inner > .flex:first-child > i {
          display: grid;
          width: 38px;
          height: 38px;
          flex: 0 0 38px;
          place-items: center;
          border: 1px solid rgba(248, 113, 113, .35);
          border-radius: 12px;
          background: rgba(220, 38, 38, .12);
          font-size: 17px !important;
          box-shadow: inset 0 1px rgba(255, 255, 255, .04);
        }

        nav h1 {
          overflow: hidden;
          font-size: 15px !important;
          line-height: 1.15 !important;
          letter-spacing: .035em !important;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        #connectionStatus {
          margin-top: 3px;
          font-size: 10px !important;
          letter-spacing: .02em;
        }

        .app-nav-actions {
          position: fixed;
          right: 0;
          bottom: 0;
          left: 0;
          z-index: 80;
          display: grid !important;
          width: 100%;
          height: var(--mobile-nav-total-height);
          grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
          gap: 6px !important;
          padding: 8px 10px .5px;
          border-top: 1px solid rgba(75, 85, 99, .62);
          background: rgba(10, 18, 28, .94);
          box-shadow: 0 -12px 32px rgba(0, 0, 0, .26);
          -webkit-backdrop-filter: blur(22px) saturate(150%);
          backdrop-filter: blur(22px) saturate(150%);
        }

        .app-nav-actions button {
          display: flex !important;
          min-width: 0 !important;
          min-height: 56px;
          flex-direction: column;
          justify-content: center;
          gap: 4px;
          padding: 5px 4px !important;
          border-color: transparent !important;
          border-radius: 13px !important;
          box-shadow: none !important;
          font-size: 10px !important;
          letter-spacing: .04em !important;
        }

        .app-nav-actions button i {
          margin: 0 !important;
          font-size: 17px;
        }

        .app-nav-actions button[aria-selected="false"] {
          background: transparent !important;
          color: #8792a3 !important;
        }

        .app-nav-actions button[aria-selected="true"] {
          border-color: rgba(248, 113, 113, .26) !important;
          background: rgba(220, 38, 38, .16) !important;
          color: #fca5a5 !important;
        }

        main {
          width: 100% !important;
          max-width: 100% !important;
          padding: 12px 12px calc(var(--mobile-nav-total-height) + 18px) !important;
        }

        #tab-entry { max-width: 100% !important; }

        #tab-entry > div,
        #tab-history > div,
        #tab-stats > div,
        #widget-monthly,
        #widget-natures,
        #widget-addresses,
        #widget-mutual,
        #widget-crew,
        #widget-districts,
        #widget-voldispo,
        #widget-time-analysis > div {
          border-color: rgba(75, 85, 99, .56) !important;
          background-color: rgba(22, 31, 43, .9) !important;
          box-shadow: 0 14px 38px rgba(0, 0, 0, .2) !important;
        }

        #tab-entry > div > div:first-child {
          padding: 15px 16px !important;
          background: linear-gradient(135deg, rgba(31, 41, 55, .98), rgba(24, 34, 47, .94)) !important;
        }

        #tab-entry > div > div:first-child h2 { font-size: 15px !important; }
        #previewIncidentId { font-size: 20px !important; }
        #callForm { padding: 16px !important; }

        #callForm.space-y-6 > :not([hidden]) ~ :not([hidden]),
        #editModal .space-y-6 > :not([hidden]) ~ :not([hidden]) {
          margin-top: 18px !important;
        }

        #callForm .gap-6,
        #editModal .gap-6,
        #monthModal .gap-6 { gap: 16px !important; }

        label { letter-spacing: .045em !important; }

        input:not([type="checkbox"]):not([type="file"]),
        select,
        textarea {
          min-height: 48px;
          border-radius: 12px !important;
          font-size: 16px !important;
        }

        textarea { min-height: 94px; }

        input[type="checkbox"] {
          width: 23px !important;
          height: 23px !important;
          flex: 0 0 23px;
        }

        #btn-ems,
        #btn-fire,
        #btn-both,
        #edit_btn-ems,
        #edit_btn-fire,
        #edit_btn-both {
          min-height: 48px;
          padding: 8px 4px !important;
          border-radius: 12px !important;
          font-size: 12px !important;
          transform: none !important;
        }

        #btn-ems i,
        #btn-fire i,
        #btn-both i { margin-right: 5px !important; }

        .unit-chip {
          min-height: 40px;
          padding: 9px 13px !important;
          border-radius: 12px !important;
        }

        #callForm > .pt-4:last-child {
          align-items: stretch !important;
          flex-direction: column-reverse;
          gap: 12px !important;
        }

        #submitBtn {
          width: 100%;
          min-height: 54px;
          justify-content: center;
          border-radius: 14px !important;
          font-size: 15px;
          box-shadow: 0 12px 28px rgba(127, 29, 29, .3) !important;
        }

        #callForm > .pt-4:last-child > button:first-child { min-height: 44px; }
        #tab-history > div:first-child { padding: 12px !important; }

        #tab-history > div:first-child > div:first-child,
        #tab-history > div:first-child > div:first-child > div {
          align-items: stretch !important;
        }

        #tab-history > div:first-child button,
        #tab-history > div:first-child label {
          min-height: 44px;
          justify-content: center;
        }

        #tab-history > div:nth-child(2) {
          height: auto !important;
          min-height: 420px;
          overflow: visible !important;
        }

        #historyCallCards { padding: 10px !important; }

        .mobile-call-card {
          border-radius: 14px !important;
          background: rgba(17, 24, 39, .82) !important;
          box-shadow: 0 8px 22px rgba(0, 0, 0, .18);
        }

        #tab-stats > div:first-child {
          align-items: stretch !important;
          margin-bottom: 14px !important;
          padding: 4px 2px;
        }

        #tab-stats > div:first-child h2 { font-size: 17px !important; }

        #tab-stats > .grid.grid-cols-1.sm\\:grid-cols-3 {
          grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
          gap: 8px !important;
        }

        #tab-stats > .grid.grid-cols-1.sm\\:grid-cols-3 > div {
          padding: 13px 10px !important;
          text-align: center;
        }

        #tab-stats > .grid.grid-cols-1.sm\\:grid-cols-3 h3 {
          font-size: 9px !important;
          line-height: 1.25;
        }

        #tab-stats > .grid.grid-cols-1.sm\\:grid-cols-3 p { font-size: 24px !important; }
        #tab-stats .p-6 { padding: 16px !important; }

        #editModal,
        #monthModal {
          align-items: flex-end !important;
          padding: 0 !important;
        }

        #editModal > div,
        #monthModal > div {
          width: 100% !important;
          max-height: 96% !important;
          border-right: 0 !important;
          border-bottom: 0 !important;
          border-left: 0 !important;
          border-radius: 22px 22px 0 0 !important;
        }

        #editModal > div > div,
        #monthModal > div > div { padding: 16px !important; }

        #editModal > div > div:last-child {
          gap: 10px;
          padding-bottom: 18px !important;
        }

        #editModal > div > div:last-child > div { gap: 8px !important; }

        #editModal > div > div:last-child button {
          min-height: 46px;
          padding: 8px 12px !important;
          font-size: 11px;
        }

        #toast {
          right: 12px !important;
          bottom: calc(var(--mobile-nav-total-height) + 12px) !important;
          left: 12px !important;
          justify-content: center;
          padding: 14px 16px !important;
          border-radius: 14px !important;
        }

        @media (orientation: landscape) and (max-height: 500px) {
          :root { --mobile-nav-height: 62px; }
          nav { position: relative !important; min-height: 56px; }
          .app-nav-actions { padding-top: 5px; padding-bottom: .5px; }
          .app-nav-actions button { min-height: 48px; }
        }

        @media (prefers-reduced-motion: reduce) {
          *, *::before, *::after { scroll-behavior: auto !important; }
        }
      `;

      function prepareMobileApp() {
        try {
          const appDocument = frame.contentDocument;
          if (!appDocument) return;

          appDocument.documentElement.classList.add('mobile-home-screen');
          const hostSafeBottom = getComputedStyle(document.documentElement)
            .getPropertyValue('--safe-bottom')
            .trim() || '0px';
          appDocument.documentElement.style.setProperty('--host-safe-bottom', hostSafeBottom);

          const viewport = appDocument.querySelector('meta[name="viewport"]');
          if (viewport) {
            viewport.content = 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';
          }

          const oldStyle = appDocument.getElementById('iphone-mobile-overrides');
          if (oldStyle) oldStyle.remove();
          const style = appDocument.createElement('style');
          style.id = 'iphone-mobile-overrides';
          style.textContent = mobileStyles;
          appDocument.head.appendChild(style);

          const tabBar = appDocument.querySelector('.app-nav-actions');
          if (tabBar && tabBar.parentElement !== appDocument.body) {
            appDocument.body.appendChild(tabBar);
          }

          const appTitle = appDocument.querySelector('nav h1');
          if (appTitle) appTitle.textContent = 'RMS Call Tracker';

          frame.classList.add('ready');
          launchScreen.classList.add('hidden');
        } catch (error) {
          launchScreen.querySelector('.launch-caption').textContent = 'Unable to open the application';
          launchScreen.querySelector('.spinner').hidden = true;
        }
      }

      frame.addEventListener('load', prepareMobileApp);
    })();
  </script>
</body>
</html>
